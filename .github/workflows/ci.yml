name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # black is configured (pyproject.toml) but the existing codebase was
      # never actually formatted with it -- enforcing `black --check .` here
      # would fail on pre-existing, unrelated files from day one. Revisit
      # once a deliberate whole-repo reformat lands.

      - name: Tests
        run: pytest
