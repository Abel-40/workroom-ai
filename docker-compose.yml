services:
  workroom-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: workroom-ai:v1.0
    container_name: workroom-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - .:/workroom-ai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/check')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    command: uvicorn apps.main:app --host 0.0.0.0 --port 8001 --reload
